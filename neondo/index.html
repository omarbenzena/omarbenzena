n><small>Clear rates · verified profiles · rebook your favourites</small></section><footer class="footer"><div class="container footer-grid"><div>${brand()}<p>Creative + event work, built for Berlin.</p></div><div class="footer-links"><a href="#opportunities">Opportunities</a><a href="#roles">Roles</a><a href="#how">How it works</a><a href="#" onclick="openLegal('Impressum');return false">Impressum</a><a href="#" onclick="openLegal('Datenschutz');return false">Datenschutz</a><a href="#" onclick="openLegal('AGB');return false">AGB</a></div><small>Berlin pilot · 18+ only</small></div></footer></main>`}
function setFilter(v){state.filter=v;render();setTimeout(()=>document.querySelector('#opportunities')?.scrollIntoView({behavior:'smooth'}),20)}
function openAuth(mode='login',role='worker'){document.body.insertAdjacentHTML('beforeend',`<div class="modal-back" id="auth"><div class="modal"><div class="modal-head"><h2>${mode==='login'?'Welcome back':'Join NEONDO'}</h2><button class="close" onclick="$('#auth').remove()">✕</button></div><div class="auth-tabs"><button class="${mode==='login'?'active':''}" onclick="$('#auth').remove();openAuth('login')">Log in</button><button class="${mode==='signup'?'active':''}" onclick="$('#auth').remove();openAuth('signup','worker')">Sign up</button></div>${mode==='signup'?`<div class="field"><label>I want to</label><select id="arole"><option value="worker" ${role==='worker'?'selected':''}>Find creative/event work</option><option value="company" ${role==='company'?'selected':''}>Hire crew + creatives</option></select></div><div class="form-row"><div class="field"><label>First name</label><input id="afirst"></div><div class="field"><label>Last name</label><input id="alast"></div></div><div class="field"><label>Company name (companies)</label><input id="acompany"></div>`:''}<div class="field"><label>Email</label><input id="aemail" type="email"></div><div class="field"><label>Password</label><input id="apass" type="password" minlength="8"></div><button class="solid-btn" style="width:100%" onclick="${mode==='login'?'doLogin()':'doSignup()'}"><span>${mode==='login'?'Log in':'Create account'}</span><span>↗</span></button><div id="authmsg"></div></div></div>`)}
async function doLogin(){if(!sb)return toast('Authentication service is loading. Try again in a moment.','warn');$('#authmsg').innerHTML='<div class="notice">Signing in…</div>';let {data,error}=await sb.auth.signInWithPassword({email:$('#aemail').value.trim(),password:$('#apass').value});if(error)return $('#authmsg').innerHTML=`<div class="notice err">${esc(error.message)}</div>`;state.user=data.user;await loadProfile();$('#auth').remove();state.screen='dashboard';state.route='overview';render()}
async function doSignup(){if(!sb)return toast('Authentication service is loading. Try again in a moment.','warn');let role=$('#arole').value,email=$('#aemail').value.trim(),password=$('#apass').value;if(password.length<8)return $('#authmsg').innerHTML='<div class="notice err">Use at least 8 password characters.</div>';let {data,error}=await sb.auth.signUp({email,password,options:{data:{role,first_name:$('#afirst').value.trim(),last_name:$('#alast').value.trim(),company_name:$('#acompany').value.trim()},emailRedirectTo:location.origin}});if(error)return $('#authmsg').innerHTML=`<div class="notice err">${esc(error.message)}</div>`;if(data.session){state.user=data.user;await new Promise(r=>setTimeout(r,450));await loadProfile();$('#auth').remove();state.screen='dashboard';state.route='profile';render()}else $('#authmsg').innerHTML='<div class="notice ok">Account created. Check your email to confirm it, then log in.</div>'}
async function saveShift(id){if(id.startsWith('demo-'))return toast('Demo opportunity saved.');if(!state.profile||state.profile.role!=='worker')return openAuth('login','worker');let {error}=await sb.from('saved_shifts').upsert({worker_id:state.user.id,shift_id:id});toast(error?error.message:'Saved.',error?'err':'ok')}

function navItems(){let r=state.profile?.role||'worker';if(r==='worker')return [['overview','⌂','Overview'],['find','⌕','Find work'],['schedule','▣','Schedule'],['availability','◷','Availability'],['earnings','€','Earnings'],['messages','✉','Messages'],['profile','◎','Profile'],['notifications','●','Notifications'],['account','⚙','Account']];if(r==='company')return [['overview','⌂','Overview'],['events','▣','Events'],['create','＋','Post opportunity'],['crew','◎','Find talent'],['applications','✓','Applicants'],['timesheets','◷','Timesheets'],['messages','✉','Messages'],['profile','⚙','Company'],['account','⚙','Account']];return [['overview','⌂','Admin'],['users','◎','Users'],['events','▣','Events'],['account','⚙','Account']]}
function dashboardShell(){let n=navItems();return `<div class="dashboard"><div class="dash-top"><div class="container dash-top-inner"><a href="#" onclick="goLanding();return false">${brand()}</a><div class="dash-actions">${langSelect()}<button class="icon-btn" onclick="setTheme()">◐</button><button class="small-btn" onclick="logout()">Log out</button></div></div></div><div class="dash-shell"><aside class="sidebar">${n.map(x=>`<button class="${state.route===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]} &nbsp; ${x[2]}</button>`).join('')}</aside><main class="dash-content" id="dashPage"></main></div><nav class="bottom-nav">${n.slice(0,4).map(x=>`<button onclick="go('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join('')}<button onclick="openMore()"><b>•••</b>More</button></nav></div>`}

async function renderDash(){let el=$('#dashPage');if(!el||!state.profile)return;let r=state.profile.role;try{if(state.route==='overview')el.innerHTML=await dashOverview(r);else if(state.route==='find')el.innerHTML=`<h1 class="dash-title">Find work</h1><p class="dash-sub">Creative projects, performances and event shifts around Berlin.</p><div class="dash-job-grid">${cards(state.jobs)}</div>`;else if(state.route==='schedule')el.innerHTML=await schedulePage();else if(state.route==='availability')el.innerHTML=await availabilityPage();else if(state.route==='earnings')el.innerHTML=await earningsPage();else if(state.route==='messages')el.innerHTML=await messagesPage();else if(state.route==='profile')el.innerHTML=await profilePage(r);else if(state.route==='notifications')el.innerHTML=await notificationsPage();else if(state.route==='events')el.innerHTML=await eventsPage();else if(state.route==='create')el.innerHTML=createPage();else if(state.route==='crew')el.innerHTML=await crewPage();else if(state.route==='applications')el.innerHTML=await applicationsPage();else if(state.route==='timesheets')el.innerHTML=await companyTimesheets();else if(state.route==='users')el.innerHTML=await usersPage();else if(state.route==='account')el.innerHTML=accountPage();}catch(e){el.innerHTML=`<div class="notice err">${esc(e.message||e)}</div>`}}
async function dashOverview(r){if(state.demoRole)return r==='worker'?`<h1 class="dash-title">Hey, Omar 👋</h1><p class="dash-sub">Your creative + event work in one place.</p><div class="metrics"><div class="metric"><b>2</b><span>UPCOMING GIGS</span></div><div class="metric"><b>1</b><span>APPLICATIONS</span></div><div class="metric"><b>4.9</b><span>RATING</span></div><div class="metric"><b>€684</b><span>THIS MONTH</span></div></div><div class="panel"><div class="panel-head"><h3>Next booking</h3></div><div class="item"><div><h4>Nightlife photographer</h4><p>Fri 28 Aug · 22:00 · Neukölln</p></div><span class="status">CONFIRMED</span></div></div>`:`<h1 class="dash-title">NEONDO Demo Events</h1><p class="dash-sub">Find and rebook the right people.</p><div class="metrics"><div class="metric"><b>3</b><span>UPCOMING EVENTS</span></div><div class="metric"><b>18</b><span>PEOPLE BOOKED</span></div><div class="metric"><b>4</b><span>OPEN POSITIONS</span></div><div class="metric"><b>126</b><span>APPROVED HOURS</span></div></div>`;if(r==='worker'){let [{data:a},{data:b},{data:t}]=await Promise.all([sb.from('applications').select('id,status').eq('worker_id',state.user.id),sb.from('bookings').select('id,status,shifts(title,start_at,events(location))').eq('worker_id',state.user.id),sb.from('timesheets').select('id,status').eq('worker_id',state.user.id)]);return `<h1 class="dash-title">Hey, ${esc(state.profile.first_name||'crew')} 👋</h1><p class="dash-sub">Your next work, applications and verified history.</p>${!state.profile.onboarding_complete?'<div class="notice warn">Finish your profile before applying to live opportunities. <button class="small-btn" onclick="go(\'profile\')">Complete profile</button></div>':''}<div class="metrics"><div class="metric"><b>${(b||[]).filter(x=>x.status==='confirmed').length}</b><span>UPCOMING</span></div><div class="metric"><b>${(a||[]).filter(x=>x.status==='applied').length}</b><span>APPLICATIONS</span></div><div class="metric"><b>${state.worker?.rating_avg||'—'}</b><span>RATING</span></div><div class="metric"><b>${(t||[]).filter(x=>x.status==='approved').length}</b><span>APPROVED GIGS</span></div></div><div class="panel"><div class="panel-head"><h3>Next bookings</h3><button class="small-btn" onclick="go('find')">Find work</button></div>${(b||[]).filter(x=>x.status==='confirmed').slice(0,4).map(x=>`<div class="item"><div><h4>${esc(x.shifts?.title||'Booking')}</h4><p>${datefmt(x.shifts?.start_at)} · ${esc(x.shifts?.events?.location||'Berlin')}</p></div><span class="status">CONFIRMED</span></div>`).join('')||'<div class="empty">No confirmed bookings yet.</div>'}</div>`}if(r==='company'){let [{data:e},{data:b}]=await Promise.all([sb.from('events').select('*').eq('company_id',state.user.id),sb.from('bookings').select('*').eq('company_id',state.user.id)]);return `<h1 class="dash-title">${esc(state.company?.company_name||state.profile.company_name||'Company')}</h1><p class="dash-sub">Staff your next event with verified crew + creatives.</p>${!state.profile.verified?'<div class="notice warn"><b>Verification required before publishing.</b> You can still save drafts.</div>':''}<div class="metrics"><div class="metric"><b>${(e||[]).filter(x=>['open','upcoming'].includes(x.status)).length}</b><span>UPCOMING EVENTS</span></div><div class="metric"><b>${(b||[]).filter(x=>x.status==='confirmed').length}</b><span>PEOPLE BOOKED</span></div><div class="metric"><b>${(e||[]).filter(x=>x.status==='draft').length}</b><span>DRAFTS</span></div><div class="metric"><b>${state.profile.verified?'YES':'PENDING'}</b><span>VERIFIED</span></div></div><div class="panel"><div class="panel-head"><h3>Your events</h3><button class="small-btn solid" onclick="go('create')">Post opportunity</button></div>${(e||[]).slice(0,5).map(x=>`<div class="item"><div><h4>${esc(x.title)}</h4><p>${x.event_date} · ${esc(x.location||'')}</p></div><span class="status">${x.status}</span></div>`).join('')||'<div class="empty">Create your first opportunity.</div>'}</div>`}return adminOverview()}
async function schedulePage(){if(state.demoRole)return `<h1 class="dash-title">Schedule</h1><p class="dash-sub">Confirmed and completed work.</p><div class="panel"><div class="item"><div><h4>Nightlife photographer</h4><p>28 Aug · 22:00 · Neukölln</p></div><span class="status">CONFIRMED</span></div></div>`;let {data}=await sb.from('bookings').select('id,status,shifts(title,start_at,end_at,events(location))').eq('worker_id',state.user.id).order('created_at',{ascending:false});return `<h1 class="dash-title">Schedule</h1><p class="dash-sub">Confirmed and completed work.</p><div class="panel">${(data||[]).map(x=>`<div class="item"><div><h4>${esc(x.shifts?.title||'Booking')}</h4><p>${datefmt(x.shifts?.start_at)} · ${esc(x.shifts?.events?.location||'')}</p></div><div><span class="status">${x.status}</span> <button class="small-btn" onclick="openChat('${x.id}')">Chat</button></div></div>`).join('')||'<div class="empty">No bookings yet.</div>'}</div>`}
async function availabilityPage(){if(state.demoRole)return `<h1 class="dash-title">Availability</h1><p class="dash-sub">Set the dates you can work.</p><div class="notice ok">Demo availability is active.</div>`;let {data}=await sb.from('availability').select('*').eq('worker_id',state.user.id).gte('date',new Date().toISOString().slice(0,10)).order('date');return `<h1 class="dash-title">Availability</h1><p class="dash-sub">Tell NEONDO when you can work.</p><div class="panel"><div class="form-row"><div class="field"><label>Date</label><input id="avdate" type="date"></div><div class="field"><label>Status</label><select id="avstatus"><option>Available</option><option>Unavailable</option><option>Busy</option></select></div></div><button class="small-btn solid" onclick="saveAvailability()">Save availability</button>${(data||[]).map(x=>`<div class="item"><b>${x.date}</b><span class="status">${x.status}</span></div>`).join('')}</div>`}

async function earningsPage(){if(state.demoRole)return `<h1 class="dash-title">Earnings</h1><div class="metrics"><div class="metric"><b>€684</b><span>APPROVED</span></div><div class="metric"><b>€144</b><span>PENDING</span></div></div>`;let {data}=await sb.from('timesheets').select('*,bookings(shifts(title,start_at))').eq('worker_id',state.user.id).order('created_at',{ascending:false});let approved=(data||[]).filter(x=>x.status==='approved');let total=approved.reduce((a,x)=>{if(!x.actual_start||!x.actual_end)return a;return a+Math.max(0,(new Date(x.actual_end)-new Date(x.actual_start))/36e5-(x.break_minutes||0)/60)*(x.hourly_rate||0)},0);return `<h1 class="dash-title">Earnings</h1><p class="dash-sub">Approved hours × booked rate.</p><div class="metrics"><div class="metric"><b>€${total.toFixed(2)}</b><span>APPROVED</span></div><div class="metric"><b>${(data||[]).filter(x=>x.status==='submitted').length}</b><span>PENDING TIMESHEETS</span></div></div><div class="panel">${(data||[]).map(x=>`<div class="item"><div><h4>${esc(x.bookings?.shifts?.title||'Gig')}</h4><p>${x.status} · €${x.hourly_rate}/h</p></div><span class="status">${x.status}</span></div>`).join('')||'<div class="empty">No timesheets yet.</div>'}</div>`}
async function profilePage(r){if(state.demoRole)return `<h1 class="dash-title">Profile</h1><p class="dash-sub">Demo ${r} profile.</p><div class="profile-card"><b>${r==='worker'?'Omar · Stagehand / Creative crew':'NEONDO Demo Events'}</b></div>`;if(r==='worker'){let w=state.worker||{};return `<h1 class="dash-title">Your profile</h1><p class="dash-sub">This is the proof companies see when you apply.</p><div class="panel"><div class="form-row"><div class="field"><label>First name</label><input id="pf" value="${esc(state.profile.first_name||w.first_name||'')}"></div><div class="field"><label>Last name</label><input id="pl" value="${esc(state.profile.last_name||w.last_name||'')}"></div></div><div class="form-row"><div class="field"><label>Primary role</label><select id="pr">${ROLE_OPTIONS.map(x=>`<option ${w.primary_role===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Experience</label><select id="pe">${['New','Some experience','Experienced','Professional'].map(x=>`<option ${w.experience_level===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>City</label><input id="pc" value="${esc(w.city||'Berlin')}"></div><div class="field"><label>Bio</label><textarea id="pb">${esc(w.bio||'')}</textarea></div><button class="small-btn solid" onclick="saveWorkerProfile()">Save & complete profile</button></div>`}let c=state.company||{};return `<h1 class="dash-title">Company profile</h1><p class="dash-sub">Company details and verification.</p><div class="panel"><div class="notice ${state.profile.verified?'ok':'warn'}">${state.profile.verified?'Verified company ✓':'Verification pending — publishing unlocks after admin verification.'}</div><div class="field"><label>Company name</label><input id="cn" value="${esc(c.company_name||state.profile.company_name||'')}"></div><div class="form-row"><div class="field"><label>Company type</label><input id="ct" value="${esc(c.company_type||'Production / Event company')}"></div><div class="field"><label>Website</label><input id="cw" value="${esc(c.website||'')}"></div></div><button class="small-btn solid" onclick="saveCompanyProfile()">Save company</button></div>`}

async function notificationsPage(){if(state.demoRole)return `<h1 class="dash-title">Notifications</h1><div class="panel"><div class="item"><div><h4>Your application was accepted</h4><p>Nightlife photographer · just now</p></div><span class="status">NEW</span></div></div>`;let {data}=await sb.from('notifications').select('*').eq('user_id',state.user.id).order('created_at',{ascending:false}).limit(50);return `<h1 class="dash-title">Notifications</h1><p class="dash-sub">Bookings, applications, invitations and timesheets.</p><div class="panel">${(data||[]).map(x=>`<div class="item"><div><h4>${esc(x.title)}</h4><p>${esc(x.body||'')}</p></div>${x.read_at?'':'<span class="status">NEW</span>'}</div>`).join('')||'<div class="empty">You’re all caught up.</div>'}</div>`}
async function eventsPage(){if(state.demoRole)return `<h1 class="dash-title">Events</h1><div class="panel"><div class="item"><div><h4>After Hours Berlin</h4><p>29 Aug · Kreuzberg</p></div><span class="status">OPEN</span></div></div>`;let {data}=await sb.from('events').select('*,shifts(*)').eq('company_id',state.user.id).order('event_date',{ascending:false});return `<h1 class="dash-title">Events</h1><p class="dash-sub">Your drafts, live opportunities and completed events.</p><button class="small-btn solid" onclick="go('create')">＋ Post opportunity</button><div class="panel">${(data||[]).map(x=>`<div class="item"><div><h4>${esc(x.title)}</h4><p>${x.event_date} · ${esc(x.location||'')} · ${(x.shifts||[]).reduce((a,s)=>a+(s.workers_booked||0),0)} / ${(x.shifts||[]).reduce((a,s)=>a+(s.workers_needed||0),0)} booked</p></div><span class="status">${x.status}</span></div>`).join('')||'<div class="empty">No events yet.</div>'}</div>`}
function createPage(){return `<h1 class="dash-title">Post an opportunity</h1><p class="dash-sub">Creative project, performance or event shift.</p>${!state.profile.verified?'<div class="notice warn">Your company is not verified yet. You can save drafts, but publishing requires verification.</div>':''}<div class="panel"><div class="field"><label>Opportunity title</label><input id="et" placeholder="Nightlife photographer"></div><div class="form-row"><div class="field"><label>Date</label><input id="ed" type="date"></div><div class="field"><label>Type</label><select id="etype"><option>Creative project</option><option>Performance</option><option>Event shift</option><option>Production</option></select></div></div><div class="form-row"><div class="field"><label>Venue</label><input id="ev"></div><div class="field"><label>Location</label><input id="el" value="Berlin"></div></div><div class="form-row"><div class="field"><label>Start</label><input id="es" type="time" value="18:00"></div><div class="field"><label>End</label><input id="ee" type="time" value="23:00"></div></div><div class="field"><label>Description</label><textarea id="ex"></textarea></div><div class="form-row"><div class="field"><label>Role</label><select id="er">${ROLE_OPTIONS.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>People needed</label><input id="ec" type="number" min="1" value="1"></div></div><div class="field"><label>Hourly rate (€)</label><input id="era" type="number" min="0" step=".5" value="20"></div><button class="small-btn" onclick="createEvent('draft')">Save draft</button> <button class="small-btn solid" onclick="createEvent('open')">Publish opportunity</button></div>`}
async function createEvent(status){if(state.demoRole)return toast('Demo opportunity created.');let p={title:$('#et').value,date:$('#ed').value,eventType:$('#etype').value,venue:$('#ev').value,location:$('#el').value,startTime:$('#es').value,endTime:$('#ee').value,description:$('#ex').value,status,roles:[{name:$('#er').value,count:+$('#ec').value,rate:+$('#era').value,experience:'Any'}]};if(!p.title||!p.date)return toast('Add a title and date.','warn');let {error}=await sb.rpc('create_event_with_shifts',{p_payload:p});if(error)return toast(error.message,'err');toast(status==='draft'?'Draft saved.':'Opportunity published.');go('events')}
async function crewPage(){if(state.demoRole)return `<h1 class="dash-title">Find talent</h1><p class="dash-sub">Search across creative + event roles.</p><div class="dash-job-grid"><div class="profile-card"><b>Maya K.</b><p>Photographer · 4.9 ★</p></div><div class="profile-card"><b>Jonas R.</b><p>Stagehand · 4.8 ★</p></div><div class="profile-card"><b>Samira A.</b><p>DJ · 4.9 ★</p></div></div>`;let {data}=await sb.from('worker_profiles').select('id,first_name,last_name,primary_role,experience_level,city,rating_avg,completed_jobs,verified').eq('suspended',false).limit(40);return `<h1 class="dash-title">Find talent</h1><p class="dash-sub">DJs, photographers, video, stage crew, production and more.</p><div class="dash-job-grid">${(data||[]).map(x=>`<div class="profile-card"><div class="profile-top"><span class="avatar">${esc((x.first_name||'W')[0])}</span><div><h3>${esc((x.first_name||'Worker')+' '+(x.last_name||''))}</h3><p>${esc(x.primary_role||'Creative / Crew')} · ${esc(x.city||'Berlin')}</p><small>${x.rating_avg||'—'} ★ · ${x.completed_jobs||0} gigs</small></div>${x.verified?'<b class="availability">VERIFIED</b>':''}</div><button class="small-btn" style="margin-top:12px" onclick="fav('${x.id}')">♡ Favourite</button></div>`).join('')||'<div class="empty">No public profiles yet.</div>'}</div>`}
async function fav(id){let {error}=await sb.from('favourites').upsert({company_id:state.user.id,worker_id:id});toast(error?error.message:'Added to favourites.',error?'err':'ok')}
async function applicationsPage(){if(state.demoRole)return `<h1 class="dash-title">Applicants</h1><div class="panel"><div class="item"><div><h4>Maya K. · Photographer</h4><p>Experienced · 4.9 ★</p></div><button class="small-btn solid">Accept & book</button></div></div>`;let {data:e}=await sb.from('events').select('id').eq('company_id',state.user.id),eventIds=(e||[]).map(x=>x.id);if(!eventIds.length)return `<h1 class="dash-title">Applicants</h1><div class="empty">Post an opportunity first.</div>`;let {data:s}=await sb.from('shifts').select('id,title').in('event_id',eventIds),shiftIds=(s||[]).map(x=>x.id);if(!shiftIds.length)return `<div class="empty">No shifts yet.</div>`;let {data:a}=await sb.from('applications').select('id,status,shift_id,worker_profiles(first_name,last_name,primary_role,experience_level,rating_avg)').in('shift_id',shiftIds).order('created_at',{ascending:false});return `<h1 class="dash-title">Applicants</h1><p class="dash-sub">Review proof and book the right person.</p><div class="panel">${(a||[]).map(x=>`<div class="item"><div><h4>${esc((x.worker_profiles?.first_name||'Worker')+' '+(x.worker_profiles?.last_name||''))}</h4><p>${esc(x.worker_profiles?.primary_role||'Creative / Crew')} · ${esc(x.worker_profiles?.experience_level||'')} · ${x.worker_profiles?.rating_avg||'—'} ★</p></div>${x.status==='applied'?`<button class="small-btn solid" onclick="acceptApp('${x.id}')">Accept & book</button>`:`<span class="status">${x.status}</span>`}</div>`).join('')||'<div class="empty">No applications yet.</div>'}</div>`}
async function acceptApp(id){let {error}=await sb.rpc('accept_application',{p_application:id});toast(error?error.message:'Booked.',error?'err':'ok');renderDash()}
async function companyTimesheets(){if(state.demoRole)return `<h1 class="dash-title">Timesheets</h1><div class="panel"><div class="item"><div><h4>Concert stagehand</h4><p>7.5 h · €18/h</p></div><button class="small-btn solid">Approve</button></div></div>`;let {data}=await sb.from('timesheets').select('*,bookings(shifts(title))').eq('company_id',state.user.id).order('created_at',{ascending:false});return `<h1 class="dash-title">Timesheets</h1><p class="dash-sub">Review submitted hours before approval.</p><div class="panel">${(data||[]).map(x=>`<div class="item"><div><h4>${esc(x.bookings?.shifts?.title||'Gig')}</h4><p>${x.status} · €${x.hourly_rate}/h</p></div>${x.status==='submitted'?`<button class="small-btn solid" onclick="approveTimesheet('${x.id}')">Approve</button>`:`<span class="status">${x.status}</span>`}</div>`).join('')||'<div class="empty">No timesheets yet.</div>'}</div>`}
async function approveTimesheet(id){let {error}=await sb.from('timesheets').update({status:'approved',approved_at:new Date().toISOString()}).eq('id',id);toast(error?error.message:'Timesheet approved.',error?'err':'ok');renderDash()}
async function messagesPage(){if(state.demoRole)return `<h1 class="dash-title">Messages</h1><div class="notice">Booking-only chat opens after a person is confirmed.</div>`;let q=sb.from('bookings').select('id,status,shifts(title,start_at)').order('created_at',{ascending:false});q=state.profile.role==='worker'?q.eq('worker_id',state.user.id):q.eq('company_id',state.user.id);let {data}=await q;return `<h1 class="dash-title">Messages</h1><p class="dash-sub">Booking-only coordination, no public contact details.</p><div class="panel">${(data||[]).map(x=>`<div class="item"><div><h4>${esc(x.shifts?.title||'Booking')}</h4><p>${datefmt(x.shifts?.start_at)} · ${x.status}</p></div><button class="small-btn" onclick="openChat('${x.id}')">Open chat</button></div>`).join('')||'<div class="empty">No booked gigs to message yet.</div>'}</div>`}
async function openChat(id){if(state.demoRole)return toast('Demo chat opened.');let {data}=await sb.from('booking_messages').select('*').eq('booking_id',id).order('created_at');document.body.insertAdjacentHTML('beforeend',`<div class="modal-back" id="chatmodal"><div class="modal"><div class="modal-head"><h2>Booking chat</h2><button class="close" onclick="$('#chatmodal').remove()">✕</button></div><div class="chat">${(data||[]).map(x=>`<div class="bubble ${x.sender_id===state.user.id?'me':''}">${esc(x.body)}</div>`).join('')||'<div class="empty">No messages yet.</div>'}</div><div class="chat-compose"><input id="chatinput" placeholder="Write a message"><button class="small-btn solid" onclick="sendMessage('${id}')">Send</button></div></div></div>`)}
async function sendMessage(id){let body=$('#chatinput').value.trim();if(!body)return;let {error}=await sb.from('booking_messages').insert({booking_id:id,sender_id:state.user.id,body});if(error)return toast(error.message,'err');$('#chatmodal').remove();openChat(id)}
async function adminOverview(){let [u,e,b]=await Promise.all([sb.from('profiles').select('id',{count:'exact',head:true}),sb.from('events').select('id',{count:'exact',head:true}),sb.from('bookings').select('id',{count:'exact',head:true})]);return `<h1 class="dash-title">NEONDO Admin</h1><p class="dash-sub">Platform operations.</p><div class="metrics"><div class="metric"><b>${u.count||0}</b><span>USERS</span></div><div class="metric"><b>${e.count||0}</b><span>EVENTS</span></div><div class="metric"><b>${b.count||0}</b><span>BOOKINGS</span></div></div>`}
async function usersPage(){if(state.profile.role!=='admin')return `<div class="notice err">Admin access required.</div>`;let {data}=await sb.from('profiles').select('*').order('created_at',{ascending:false}).limit(100);return `<h1 class="dash-title">Users</h1><div class="panel">${(data||[]).map(x=>`<div class="item"><div><h4>${esc(x.first_name||x.company_name||x.email)}</h4><p>${x.role} · ${esc(x.email)}</p></div><button class="small-btn" onclick="verifyUser('${x.id}',${!x.verified})">${x.verified?'Unverify':'Verify'}</button></div>`).join('')}</div>`}
async function verifyUser(id,v){let {error}=await sb.from('profiles').update({verified:v}).eq('id',id);toast(error?error.message:'Updated.',error?'err':'ok');renderDash()}
function accountPage(){return `<h1 class="dash-title">Account</h1><p class="dash-sub">Privacy, appearance and account controls.</p><div class="panel"><h3>Privacy</h3><p style="font-size:10px;color:var(--muted)">Download your data or permanently remove your account.</p><button class="small-btn" onclick="exportData()">Download my data</button> <button class="small-btn" onclick="deleteAccount()">Delete account</button></div><div class="panel"><h3>Appearance</h3><button class="small-btn" onclick="setTheme()">◐ Toggle dark mode</button></div>`}
async function exportData(){if(state.demoRole)return toast('Demo export prepared.');let {data,error}=await sb.functions.invoke('account-data',{body:{action:'export'}});if(error)return toast(error.message,'err');let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='neondo-account-data.json';a.click()}
async function deleteAccount(){if(state.demoRole)return toast('Demo account cannot be deleted.','warn');if(!confirm('Permanently delete your NEONDO account?'))return;let {error}=await sb.functions.invoke('account-data',{body:{action:'delete'}});if(error)return toast(error.message,'err');location.reload()}
function openLegal(title){document.body.insertAdjacentHTML('beforeend',`<div class="modal-back" id="legal"><div class="modal"><div class="modal-head"><h2>${title}</h2><button class="close" onclick="$('#legal').remove()">✕</button></div><div class="notice warn">Final legal entity details and lawyer-reviewed wording must be inserted before commercial launch.</div><p style="font-size:11px;line-height:1.65">NEONDO · Berlin, Germany. This page is structurally prepared for the final company, privacy and contractual information.</p></div></div>`)}
async function logout(){if(sb&&state.user)await sb.auth.signOut();state={...state,user:null,profile:null,worker:null,company:null,demoRole:null,screen:'landing',route:'overview'};render()}
function render(){T=LANGS[lang];$('#root').innerHTML=state.screen==='dashboard'&&state.profile?dashboardShell():landing();if(state.screen==='dashboard'&&state.profile)renderDash()}
boot();
</script>
</body>
</html>
